<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Seletores CSS</title>
  <style>

    /* SELETOR DE TIPO — afeta todos os elementos daquela tag */

    h1 {
        color: rgb(206, 193, 218);
        font-family: cursive;
        font-weight: bold;
    }

    p {
        text-align: justify;
    }

    a {
        text-align: justify;
    }

    li {
        text-align: justify;
        color: blueviolet;
        margin: 25px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }


    /* SELETOR DE CLASSE — afeta elementos com class="..." */

    .destaque {
        color: rgb(134, 46, 218);
            margin: 25px;
            padding: 20px;
            border-left: gray solid 6px;
            text-align: justify;
            font-size: 20px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    }

    .alerta {
        color: rgb(101, 86, 114);
            margin: 25px;
            padding: 20px;
            border-left: gray solid 6px;
            text-align: justify;
            font-size: 20px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    }

    .secundario {
        color: blueviolet;
            margin: 25px;
            padding: 20px;
            border-left: gray solid 6px;
            text-align: justify;
            font-size: 20px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
    }


    /* SELETOR DE ID — afeta o elemento único com id="..." */

    #cabecalho {
        color: rgb(169, 225, 230);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: auto 25px;
            padding: 15px;
            box-shadow: rgba(25, 25, 168, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
            border-top: solid rgb(176, 93, 224) 8px;
    }

    #rodape {
        color: rgb(4, 5, 5);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: auto 25px;
            padding: 15px;
    }

  </style>
</head>
<body>

  <header id="cabecalho">
    <h1>Título da Página</h1>
  </header>

  <main>
    <p>Parágrafo comum.</p>
    <p class="destaque">Parágrafo com classe destaque.</p>
    <p class="alerta">Parágrafo com classe alerta.</p>
    <p class="secundario">Parágrafo com classe secundario.</p>

    <ul>
      <li>Item comum</li>
      <li class="destaque">Item com classe destaque</li>
      <li class="alerta">Item com classe alerta</li>
    </ul>

    <a href="#">Link comum</a>
  </main>

  <footer id="rodape">
    <p>Rodapé da página.</p>
  </footer>

</body>
</html>
